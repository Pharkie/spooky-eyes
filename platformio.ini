; Spooky Pumpkin Eyes: ESP32-C3 SuperMini firmware
;
;   pio run -e supermini                 build
;   pio run -e supermini -t upload       flash over USB
;   pio device monitor                   serial log
;   pio test -e native                   effect tests on this computer (no board needed)
;   python3 scripts/build_release.py     merged .bin for flashing new boards

[platformio]
default_envs = supermini

[env:supermini]
platform = espressif32@^6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
; Two 1.9 MB app slots so firmware can be updated from the web page (OTA). No filesystem:
; settings live in NVS and the web pages are compiled into the firmware.
board_build.partitions = min_spiffs.csv
extra_scripts = pre:scripts/embed_web.py
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    esphome/AsyncTCP-esphome@^2.1.4
    esphome/ESPAsyncWebServer-esphome@^3.4.0
    marian-craciunescu/ESP32Ping@^1.7
build_unflags =
    -std=gnu++11
build_flags =
    -Isrc
    -std=gnu++17
    -Wall
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DASYNC_TCP_SSL_ENABLED=0
    -DARDUINOJSON_USE_LONG_LONG=0
    -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_WARN

; Effects and frame maths compiled for this computer, checked against the MicroPython originals
[env:native]
platform = native
test_framework = unity
; Only the portable code (no Arduino): pictures, fonts, effects and text rules
build_src_filter = -<*> +<display/> +<effects/> +<core/text.cpp>
build_flags =
    -Isrc
    -std=gnu++17
    -Wall
    -DPUMPKIN_NATIVE
test_build_src = yes
